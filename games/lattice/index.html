<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>晶格 · XLattice</title>
  <meta name="theme-color" content="#e8eaee" />
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="../../assets/base.css" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <script src="../../assets/boot.js"></script>
  <style>
    .board {
      width: min(100%, 520px, calc(100dvh - 190px));
      aspect-ratio: 1;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      touch-action: none;
      user-select: none;
    }
    .cell {
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(23, 25, 30, 0.05);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      font-size: clamp(1.15rem, 5.6vw, 2rem);
    }
    [data-theme="dark"] .cell { background: rgba(255, 255, 255, 0.05); }
    .cell[data-len="3"] { font-size: clamp(1rem, 4.6vw, 1.55rem); }
    .cell[data-len="4"] { font-size: clamp(0.85rem, 3.8vw, 1.25rem); }
    @keyframes pop { from { transform: scale(0.84); } to { transform: scale(1); } }
    .cell.pop { animation: pop 0.16s ease; }
  </style>
</head>
<body>
  <div class="game">
    <a class="btn btn-ghost standalone-back" href="../../">返回游戏桌</a>
    <header class="hud">
      <div class="stat"><span class="stat-k">分数</span><b id="score">0</b></div>
      <div class="stat"><span class="stat-k">最好</span><b id="best">0</b></div>
      <button class="btn btn-ghost spacer" id="newBtn" type="button">新游戏</button>
    </header>
    <div class="board" id="board" role="group" aria-label="晶格棋盘"></div>
    <p class="toast" id="toast" hidden>到 2048 了。还可以继续。</p>
    <p class="hint">方向键、WASD，或在棋盘上滑动。相同数字会合并。</p>
    <p class="sr-only" id="live" aria-live="polite"></p>
    <div class="overlay" id="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
        <p class="dialog-kicker" id="ovTitle">这局结束</p>
        <p class="dialog-score"><b id="finalScore">0</b><span id="finalMeta">最好 0</span></p>
        <button class="btn btn-accent" id="againBtn" type="button">再来一局</button>
      </div>
    </div>
  </div>
  <script src="../../assets/game-bridge.js"></script>
  <script>
    (function () {
      'use strict';

      var N = 4;
      var SLUG = 'lattice';
      var boardEl = document.getElementById('board');
      var scoreEl = document.getElementById('score');
      var bestEl = document.getElementById('best');
      var overlay = document.getElementById('overlay');
      var finalEl = document.getElementById('finalScore');
      var metaEl = document.getElementById('finalMeta');
      var toast = document.getElementById('toast');
      var live = document.getElementById('live');
      var againBtn = document.getElementById('againBtn');

      var cells = [];
      var grid = [];
      var prev = [];
      var score = 0;
      var best = window.XGame.readBest(SLUG);
      var over = false;
      var reached = false;

      for (var i = 0; i < N * N; i++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.setAttribute('aria-label', '空');
        boardEl.appendChild(cell);
        cells.push(cell);
      }

      function palette(v) {
        var t = Math.min(Math.log2(v), 12);
        var hue = 168 - t * 12;
        var sat = 46 + t * 4;
        var light = 26 + t * 3.1;
        return {
          bg: 'hsl(' + hue + ' ' + sat + '% ' + light + '%)',
          fg: light > 58 ? '#1a140c' : '#f7fbfa'
        };
      }

      function flat() {
        var out = [];
        for (var r = 0; r < N; r++) {
          for (var c = 0; c < N; c++) out.push(grid[r][c]);
        }
        return out;
      }

      function render() {
        for (var r = 0; r < N; r++) {
          for (var c = 0; c < N; c++) {
            var idx = r * N + c;
            var v = grid[r][c];
            var el = cells[idx];
            el.dataset.v = v ? String(v) : '0';
            el.dataset.len = v ? String(String(v).length) : '0';
            el.textContent = v ? String(v) : '';
            el.setAttribute('aria-label', v ? String(v) : '空');
            if (v) {
              var p = palette(v);
              el.style.background = p.bg;
              el.style.color = p.fg;
            } else {
              el.style.background = '';
              el.style.color = '';
            }
            if (v && prev[idx] !== v) {
              el.classList.remove('pop');
              void el.offsetWidth;
              el.classList.add('pop');
            }
          }
        }
        prev = flat();
        scoreEl.textContent = String(score);
        if (score > best) {
          best = score;
          window.XGame.publish(SLUG, score, best);
          live.textContent = '分数 ' + score;
        }
        bestEl.textContent = String(best);
      }

      function empties() {
        var out = [];
        for (var r = 0; r < N; r++) {
          for (var c = 0; c < N; c++) if (!grid[r][c]) out.push([r, c]);
        }
        return out;
      }

      function addTile() {
        var slots = empties();
        if (!slots.length) return;
        var pick = slots[Math.floor(Math.random() * slots.length)];
        grid[pick[0]][pick[1]] = Math.random() < 0.9 ? 2 : 4;
      }

      /* Merge a line toward index 0. Each tile merges at most once. */
      function slide(line) {
        var vals = line.filter(Boolean);
        var out = [];
        for (var i = 0; i < vals.length; i++) {
          if (vals[i] === vals[i + 1]) {
            var merged = vals[i] * 2;
            out.push(merged);
            score += merged;
            i++;
          } else {
            out.push(vals[i]);
          }
        }
        while (out.length < N) out.push(0);
        return out;
      }

      function canMove() {
        for (var r = 0; r < N; r++) {
          for (var c = 0; c < N; c++) {
            var v = grid[r][c];
            if (!v) return true;
            if (c < N - 1 && grid[r][c + 1] === v) return true;
            if (r < N - 1 && grid[r + 1][c] === v) return true;
          }
        }
        return false;
      }

      function celebrate() {
        if (reached) return;
        for (var r = 0; r < N; r++) {
          for (var c = 0; c < N; c++) {
            if (grid[r][c] >= 2048) {
              reached = true;
              toast.hidden = false;
              live.textContent = '到达 2048，可以继续';
              return;
            }
          }
        }
      }

      function end() {
        over = true;
        finalEl.textContent = String(score);
        metaEl.textContent = '最好 ' + best;
        overlay.hidden = false;
        live.textContent = '这局结束，分数 ' + score;
        againBtn.focus();
      }

      function move(dir) {
        if (over) return;
        var before = flat().join(',');
        var r, c, line;
        if (dir === 'left' || dir === 'right') {
          for (r = 0; r < N; r++) {
            line = grid[r].slice();
            if (dir === 'right') line.reverse();
            line = slide(line);
            if (dir === 'right') line.reverse();
            grid[r] = line;
          }
        } else {
          for (c = 0; c < N; c++) {
            line = [];
            for (r = 0; r < N; r++) line.push(grid[r][c]);
            if (dir === 'down') line.reverse();
            line = slide(line);
            if (dir === 'down') line.reverse();
            for (r = 0; r < N; r++) grid[r][c] = line[r];
          }
        }
        if (flat().join(',') === before) return;
        addTile();
        render();
        celebrate();
        if (!canMove()) end();
      }

      function reset() {
        grid = [];
        for (var r = 0; r < N; r++) {
          var row = [];
          for (var c = 0; c < N; c++) row.push(0);
          grid.push(row);
        }
        prev = [];
        for (var k = 0; k < N * N; k++) prev.push(0);
        score = 0;
        over = false;
        reached = false;
        toast.hidden = true;
        overlay.hidden = true;
        addTile();
        addTile();
        render();
      }

      var keys = {
        arrowleft: 'left', arrowright: 'right', arrowup: 'up', arrowdown: 'down',
        a: 'left', d: 'right', w: 'up', s: 'down',
        h: 'left', l: 'right', k: 'up', j: 'down'
      };

      document.addEventListener('keydown', function (e) {
        var dir = keys[String(e.key).toLowerCase()];
        if (!dir) return;
        if (e.target && e.target.closest && e.target.closest('button')) return;
        e.preventDefault();
        if (!overlay.hidden) return;
        move(dir);
      });

      var startX = 0, startY = 0, tracking = false;
      boardEl.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        tracking = true;
        startX = e.clientX;
        startY = e.clientY;
        boardEl.setPointerCapture(e.pointerId);
      });
      boardEl.addEventListener('pointerup', function (e) {
        if (!tracking) return;
        tracking = false;
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
        if (!overlay.hidden) return;
        move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      });
      boardEl.addEventListener('pointercancel', function () { tracking = false; });

      document.getElementById('newBtn').addEventListener('click', reset);
      againBtn.addEventListener('click', reset);
      bestEl.textContent = String(best);
      reset();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>打砖块 · XLattice</title>
  <meta name="theme-color" content="#e8eaee" />
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="../../assets/base.css" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <script src="../../assets/boot.js"></script>
  <style>
    .canvas-wrap.is-tall { width: min(100%, 420px); }
  </style>
</head>
<body>
  <div class="game">
    <a class="btn btn-ghost standalone-back" href="../../">返回游戏桌</a>
    <header class="hud">
      <div class="stat"><span class="stat-k">分数</span><b id="score">0</b></div>
      <div class="stat"><span class="stat-k">最好</span><b id="best">0</b></div>
      <div class="stat"><span class="stat-k">生命</span><b id="lives">3</b></div>
      <div class="stat"><span class="stat-k">轮</span><b id="round">1</b></div>
    </header>
    <div class="canvas-wrap is-tall" id="wrap">
      <canvas id="board" width="360" height="540" aria-label="打砖块画面"></canvas>
    </div>
    <div class="pad-row">
      <button class="key" type="button" id="btnLeft" aria-label="挡板向左">←</button>
      <button class="btn btn-accent" id="btnLaunch" type="button">发射</button>
      <button class="key" type="button" id="btnRight" aria-label="挡板向右">→</button>
    </div>
    <p class="hint" id="status">拖动或按左右移动挡板，空格或「发射」开球。</p>
    <p class="sr-only" id="live" aria-live="polite"></p>
    <div class="overlay" id="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
        <p class="dialog-kicker" id="ovTitle">这局结束</p>
        <p class="dialog-score"><b id="finalScore">0</b><span id="finalMeta">最好 0</span></p>
        <button class="btn btn-accent" id="againBtn" type="button">再来一局</button>
      </div>
    </div>
  </div>
  <script src="../../assets/game-bridge.js"></script>
  <script>
    (function () {
      'use strict';

      var W = 360, H = 540;
      var COLS = 8, ROWS = 5;
      var SLUG = 'breakout';
      var wrap = document.getElementById('wrap');
      var canvas = document.getElementById('board');
      var ctx = canvas.getContext('2d');
      var scoreEl = document.getElementById('score');
      var bestEl = document.getElementById('best');
      var livesEl = document.getElementById('lives');
      var roundEl = document.getElementById('round');
      var statusEl = document.getElementById('status');
      var overlay = document.getElementById('overlay');
      var againBtn = document.getElementById('againBtn');
      var live = document.getElementById('live');

      var paddle, ball, bricks, score, best, lives, round, over, raf, last, acc;
      var held = { left: false, right: false };
      var touching = false;
      best = window.XGame.readBest(SLUG);

      function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

      function paintHud() {
        scoreEl.textContent = String(score);
        bestEl.textContent = String(best);
        livesEl.textContent = String(lives);
        roundEl.textContent = String(round);
      }

      function build() {
        bricks = [];
        var margin = 12, top = 28, gap = 5;
        var brickW = (W - margin * 2 - gap * (COLS - 1)) / COLS;
        var brickH = 16;
        var colors = ['#14675a', '#1d8a74', '#c6a15a', '#d18a4a', '#c4726a'];
        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            bricks.push({
              x: margin + c * (brickW + gap),
              y: top + r * (brickH + gap),
              w: brickW,
              h: brickH,
              row: r,
              alive: true,
              color: colors[r]
            });
          }
        }
      }

      function stick() {
        ball.live = false;
        ball.vx = 0;
        ball.vy = 0;
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 2;
      }

      function launch() {
        if (over || ball.live) return;
        ball.live = true;
        var speed = Math.min(7, 3.45 + (round - 1) * 0.38);
        var angle = -Math.PI / 2 + (Math.random() * 0.5 - 0.25);
        ball.vx = Math.cos(angle) * speed;
        ball.vy = Math.sin(angle) * speed;
        statusEl.textContent = '接住它。';
      }

      function noteScore() {
        if (score > best) {
          best = score;
          window.XGame.publish(SLUG, score, best);
        }
        paintHud();
      }

      function gameOver() {
        over = true;
        ball.live = false;
        cancelAnimationFrame(raf);
        document.getElementById('finalScore').textContent = String(score);
        document.getElementById('finalMeta').textContent = '最好 ' + best;
        overlay.hidden = false;
        live.textContent = '这局结束，分数 ' + score;
        statusEl.textContent = '生命用完了。';
        draw();
        againBtn.focus();
      }

      function roundClear() {
        round += 1;
        if (lives < 5) lives += 1;
        build();
        stick();
        paintHud();
        statusEl.textContent = '清台。第 ' + round + ' 轮会更快一点。';
        live.textContent = '进入第 ' + round + ' 轮';
      }

      function hitBrick(b) {
        var cx = clamp(ball.x, b.x, b.x + b.w);
        var cy = clamp(ball.y, b.y, b.y + b.h);
        var dx = ball.x - cx;
        var dy = ball.y - cy;
        return dx * dx + dy * dy <= ball.r * ball.r;
      }

      function bounceBrick(b) {
        var dx = (ball.x - (b.x + b.w / 2)) / (b.w / 2);
        var dy = (ball.y - (b.y + b.h / 2)) / (b.h / 2);
        if (Math.abs(dx) > Math.abs(dy)) {
          ball.vx = Math.abs(ball.vx) * (dx >= 0 ? 1 : -1);
          ball.x = dx >= 0 ? b.x + b.w + ball.r : b.x - ball.r;
        } else {
          ball.vy = Math.abs(ball.vy) * (dy >= 0 ? 1 : -1);
          ball.y = dy >= 0 ? b.y + b.h + ball.r : b.y - ball.r;
        }
      }

      function update() {
        if (over) return;
        if (held.left) paddle.x -= 6.5;
        if (held.right) paddle.x += 6.5;
        paddle.x = clamp(paddle.x, 8, W - paddle.w - 8);
        if (!ball.live) {
          stick();
          return;
        }
        ball.x += ball.vx;
        ball.y += ball.vy;
        if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
        if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
        if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

        if (ball.vy > 0 &&
            ball.y + ball.r >= paddle.y &&
            ball.y - ball.r <= paddle.y + paddle.h &&
            ball.x >= paddle.x - ball.r &&
            ball.x <= paddle.x + paddle.w + ball.r) {
          var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          hit = clamp(hit, -1, 1);
          var speed = Math.min(7.2, Math.hypot(ball.vx, ball.vy) * 1.02);
          var angle = hit * (Math.PI / 3);
          ball.vx = Math.sin(angle) * speed;
          ball.vy = -Math.max(2.2, Math.abs(Math.cos(angle) * speed));
          ball.y = paddle.y - ball.r - 0.8;
        }

        for (var i = 0; i < bricks.length; i++) {
          var b = bricks[i];
          if (!b.alive || !hitBrick(b)) continue;
          b.alive = false;
          score += 10 * (ROWS - b.row);
          bounceBrick(b);
          noteScore();
          break;
        }

        if (bricks.every(function (b) { return !b.alive; })) {
          roundClear();
          return;
        }

        if (ball.y - ball.r > H) {
          lives -= 1;
          paintHud();
          if (lives <= 0) { gameOver(); return; }
          stick();
          statusEl.textContent = '接丢了。移动挡板后再发射。';
        }
      }

      function roundRect(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function draw() {
        var dark = document.documentElement.dataset.theme === 'dark';
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
        ctx.fillStyle = dark ? '#14181f' : '#fbfcfd';
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < bricks.length; i++) {
          var b = bricks[i];
          if (!b.alive) continue;
          ctx.fillStyle = b.color;
          roundRect(b.x, b.y, b.w, b.h, 4);
          ctx.fill();
        }
        ctx.fillStyle = dark ? '#e7fff8' : '#17191e';
        roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
        ctx.fill();
        ctx.fillStyle = dark ? '#7ddec8' : '#0f6e5c';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
      }

      function frame(now) {
        if (over) return;
        var dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        acc += dt;
        var step = 1 / 60;
        while (acc >= step) {
          update();
          acc -= step;
          if (over) break;
        }
        draw();
        if (!over) raf = requestAnimationFrame(frame);
      }

      function reset() {
        cancelAnimationFrame(raf);
        score = 0;
        lives = 3;
        round = 1;
        over = false;
        acc = 0;
        last = performance.now();
        paddle = { w: 78, h: 12, x: (W - 78) / 2, y: H - 36 };
        ball = { x: W / 2, y: 0, r: 6, vx: 0, vy: 0, live: false };
        build();
        stick();
        overlay.hidden = true;
        statusEl.textContent = '拖动或按左右移动挡板，空格或「发射」开球。';
        paintHud();
        draw();
        raf = requestAnimationFrame(frame);
      }

      function nudge(dir) {
        if (over) return;
        paddle.x = clamp(paddle.x + dir * 10, 8, W - paddle.w - 8);
      }

      function bindHold(button, dir) {
        var timer = 0;
        function stop() { clearInterval(timer); timer = 0; }
        button.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          try { button.setPointerCapture(e.pointerId); } catch (err) {}
          nudge(dir);
          stop();
          timer = setInterval(function () { nudge(dir); }, 16);
        });
        button.addEventListener('pointerup', stop);
        button.addEventListener('pointercancel', stop);
        button.addEventListener('lostpointercapture', stop);
      }

      document.addEventListener('keydown', function (e) {
        var k = String(e.key).toLowerCase();
        if (k === 'arrowleft' || k === 'a') { held.left = true; e.preventDefault(); }
        if (k === 'arrowright' || k === 'd') { held.right = true; e.preventDefault(); }
        if (k === ' ' || k === 'enter') {
          if (e.target && e.target.closest && e.target.closest('button')) return;
          e.preventDefault();
          if (e.repeat || over) return;
          launch();
        }
      });
      document.addEventListener('keyup', function (e) {
        var k = String(e.key).toLowerCase();
        if (k === 'arrowleft' || k === 'a') held.left = false;
        if (k === 'arrowright' || k === 'd') held.right = false;
      });
      window.addEventListener('blur', function () { held.left = false; held.right = false; });

      function paddleFrom(e) {
        var rect = canvas.getBoundingClientRect();
        if (!rect.width) return;
        var x = ((e.clientX - rect.left) / rect.width) * W;
        paddle.x = clamp(x - paddle.w / 2, 8, W - paddle.w - 8);
      }
      canvas.addEventListener('pointerdown', function (e) {
        touching = true;
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        paddleFrom(e);
      });
      canvas.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'mouse' || touching) paddleFrom(e);
      });
      canvas.addEventListener('pointerup', function () { touching = false; });
      canvas.addEventListener('pointercancel', function () { touching = false; });

      document.getElementById('btnLaunch').addEventListener('click', function () {
        if (over) reset();
        else launch();
      });
      againBtn.addEventListener('click', reset);
      bindHold(document.getElementById('btnLeft'), -1);
      bindHold(document.getElementById('btnRight'), 1);

      function resize() {
        var cssW = wrap.clientWidth || Math.min(420, window.innerWidth - 28);
        var maxH = Math.max(260, Math.min(window.innerHeight - 220, 680));
        var cssH = cssW * (H / W);
        if (cssH > maxH) cssW = maxH * (W / H);
        cssW = Math.max(200, Math.floor(cssW));
        cssH = Math.floor(cssW * (H / W));
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(cssW * dpr);
        canvas.height = Math.floor(cssH * dpr);
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        draw();
      }

      if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
      else window.addEventListener('resize', resize);
      new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

      reset();
      resize();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>碎界 · XLattice</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="../../assets/base.css" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <script src="../../assets/boot.js"></script>
  <style>
    .canvas-wrap.is-tall { width: min(100%, 440px); height: min(68vh, 640px); }
    .canvas-wrap canvas { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="game">
    <a class="btn btn-ghost standalone-back" href="../../">返回游戏桌</a>
    <header class="hud">
      <div class="stat"><span class="stat-k">分数</span><b id="score">0</b></div>
      <div class="stat"><span class="stat-k">最好</span><b id="best">0</b></div>
      <div class="stat"><span class="stat-k">生命</span><b id="lives">3</b></div>
      <button class="btn btn-ghost" id="pauseBtn" type="button">暂停</button>
      <button class="btn btn-ghost" id="muteBtn" type="button">声音</button>
    </header>
    <div class="canvas-wrap is-tall" id="wrap"><canvas id="board" width="360" height="540" aria-label="碎界画面"></canvas></div>
    <div class="pad-row">
      <button class="key" type="button" id="btnLeft" aria-label="挡板向左">←</button>
      <button class="btn btn-accent" id="btnLaunch" type="button">发射</button>
      <button class="key" type="button" id="btnRight" aria-label="挡板向右">→</button>
    </div>
    <p class="hint" id="status">拖动挡板，空格发射。铜砖会掉出加宽或分球。</p>
    <p class="sr-only" id="live" aria-live="polite"></p>
    <div class="overlay" id="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
        <p class="dialog-kicker" id="ovTitle">墙还在</p>
        <p class="dialog-score"><b id="finalScore">0</b><span id="finalMeta"></span></p>
        <button class="btn btn-accent" id="againBtn" type="button">再来一局</button>
      </div>
    </div>
  </div>
  <script src="../../assets/audio.js"></script>
  <script src="../../assets/game-bridge.js"></script>
  <script>
    (function () {
      'use strict';
      var W = 360, H = 540, COLS = 8, ROWS = 6, SLUG = 'shatter';
      var wrap = document.getElementById('wrap');
      var canvas = document.getElementById('board');
      var ctx = canvas.getContext('2d');
      var scoreEl = document.getElementById('score');
      var bestEl = document.getElementById('best');
      var livesEl = document.getElementById('lives');
      var statusEl = document.getElementById('status');
      var overlay = document.getElementById('overlay');
      var againBtn = document.getElementById('againBtn');
      var best = window.XGame.readBest(SLUG);
      var paddle, balls, bricks, drops, parts, score, lives, round, over, paused, shake, wideUntil, trail;
      var held = { left: false, right: false };
      var touching = false;
      var raf = 0, last = 0, acc = 0;

      function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
      function publish() {
        scoreEl.textContent = String(score);
        bestEl.textContent = String(best);
        livesEl.textContent = String(lives);
        if (score > best) {
          best = score;
          window.XGame.publish(SLUG, score, best);
          bestEl.textContent = String(best);
        }
      }
      function burst(x, y, color, n) {
        for (var i = 0; i < n; i++) {
          var a = Math.random() * Math.PI * 2;
          var s = 30 + Math.random() * 120;
          parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35 + Math.random() * 0.25, color: color });
        }
      }
      function build() {
        bricks = [];
        var margin = 14, top = 36, gap = 5;
        var bw = (W - margin * 2 - gap * (COLS - 1)) / COLS;
        var bh = 16;
        var colors = ['#9ad7ff', '#1f8f78', '#1f8f78', '#e7a15a', '#d4654a', '#7d5cff'];
        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            bricks.push({
              x: margin + c * (bw + gap), y: top + r * (bh + gap), w: bw, h: bh,
              alive: true, color: colors[r], power: r === 3 && c % 3 === 0
            });
          }
        }
      }
      function stick() {
        balls = [{ x: paddle.x + paddle.w / 2, y: paddle.y - 8, vx: 0, vy: 0, live: false, r: 6 }];
      }
      function launch() {
        if (over || paused) return;
        var any = false;
        balls.forEach(function (b) {
          if (b.live) return;
          any = true;
          b.live = true;
          var speed = Math.min(7.2, 3.5 + (round - 1) * 0.35);
          var angle = -Math.PI / 2 + (Math.random() * 0.4 - 0.2);
          b.vx = Math.cos(angle) * speed;
          b.vy = Math.sin(angle) * speed;
        });
        if (any) statusEl.textContent = '接住它。';
      }
      function reset() {
        score = 0; lives = 3; round = 1; over = false; paused = false; shake = 0; wideUntil = 0;
        parts = []; drops = []; trail = [];
        paddle = { x: (W - 86) / 2, y: H - 36, w: 86, h: 12, base: 86 };
        build();
        stick();
        overlay.hidden = true;
        statusEl.textContent = '拖动挡板，空格发射。铜砖会掉出加宽或分球。';
        publish();
      }
      function end() {
        over = true;
        document.getElementById('finalScore').textContent = String(score);
        document.getElementById('finalMeta').textContent = '最好 ' + best;
        overlay.hidden = false;
        window.XSound.hurt();
        live.textContent = '这局结束，分数 ' + score;
        againBtn.focus();
      }
      function update(dt) {
        if (over || paused) return;
        var now = performance.now() / 1000;
        if (held.left) paddle.x -= 460 * dt;
        if (held.right) paddle.x += 460 * dt;
        paddle.w = now < wideUntil ? paddle.base * 1.6 : paddle.base;
        paddle.x = clamp(paddle.x, 8, W - paddle.w - 8);
        shake = Math.max(0, shake - dt * 20);
        balls.forEach(function (ball) {
          if (!ball.live) {
            ball.x = paddle.x + paddle.w / 2;
            ball.y = paddle.y - ball.r - 2;
            return;
          }
          ball.x += ball.vx;
          ball.y += ball.vy;
          trail.push({ x: ball.x, y: ball.y, life: 0.25 });
          if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
          if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
          if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
          if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y <= paddle.y + paddle.h + 8 &&
              ball.x >= paddle.x - 4 && ball.x <= paddle.x + paddle.w + 4) {
            var hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
            var speed = Math.min(7.4, Math.hypot(ball.vx, ball.vy) * 1.02);
            var angle = hit * (Math.PI / 3);
            ball.vx = Math.sin(angle) * speed;
            ball.vy = -Math.max(2.3, Math.abs(Math.cos(angle) * speed));
            ball.y = paddle.y - ball.r - 1;
            window.XSound.tap();
          }
          for (var i = 0; i < bricks.length; i++) {
            var b = bricks[i];
            if (!b.alive) continue;
            var cx = clamp(ball.x, b.x, b.x + b.w);
            var cy = clamp(ball.y, b.y, b.y + b.h);
            var dx = ball.x - cx, dy = ball.y - cy;
            if (dx * dx + dy * dy > ball.r * ball.r) continue;
            b.alive = false;
            var ax = (ball.x - (b.x + b.w / 2)) / (b.w / 2);
            var ay = (ball.y - (b.y + b.h / 2)) / (b.h / 2);
            if (Math.abs(ax) > Math.abs(ay)) ball.vx = Math.abs(ball.vx) * (ax >= 0 ? 1 : -1);
            else ball.vy = Math.abs(ball.vy) * (ay >= 0 ? 1 : -1);
            score += 10 * (ROWS - Math.floor(i / COLS));
            burst(b.x + b.w / 2, b.y + b.h / 2, b.color, 8);
            shake = 3;
            window.XSound.hit();
            if (b.power) drops.push({ x: b.x + b.w / 2, y: b.y, kind: Math.random() < 0.5 ? 'wide' : 'multi', vy: 280 });
            break;
          }
          if (ball.y - ball.r > H) ball.live = false;
        });
        balls = balls.filter(function (b) { return b.y < H + 30; });
        if (!balls.length) {
          lives -= 1;
          publish();
          if (lives <= 0) { end(); return; }
          window.XSound.hurt();
          stick();
          statusEl.textContent = '掉下去了。再发射。';
        }
        for (var d = drops.length - 1; d >= 0; d--) {
          var drop = drops[d];
          drop.y += drop.vy * dt;
          if (drop.y > paddle.y && drop.y < paddle.y + 20 && drop.x > paddle.x && drop.x < paddle.x + paddle.w) {
            if (drop.kind === 'wide') { wideUntil = performance.now() / 1000 + 8; statusEl.textContent = '挡板变宽了。'; }
            else {
              var src = balls[0];
              if (src) balls.push({ x: src.x, y: src.y, vx: -src.vx || -2, vy: src.vy, live: true, r: 6 });
              statusEl.textContent = '多了一颗球。';
            }
            window.XSound.coin();
            drops.splice(d, 1);
          } else if (drop.y > H) drops.splice(d, 1);
        }
        if (bricks.every(function (b) { return !b.alive; })) {
          round += 1;
          if (lives < 5) lives += 1;
          build();
          stick();
          statusEl.textContent = '清台。第 ' + round + ' 轮。';
          window.XSound.win();
        }
        for (var p = parts.length - 1; p >= 0; p--) {
          parts[p].life -= dt;
          parts[p].x += parts[p].vx * dt;
          parts[p].y += parts[p].vy * dt;
          if (parts[p].life <= 0) parts.splice(p, 1);
        }
        for (var t = trail.length - 1; t >= 0; t--) {
          trail[t].life -= dt;
          if (trail[t].life <= 0) trail.splice(t, 1);
        }
        publish();
      }
      function draw() {
        var cssW = wrap.clientWidth || 360;
        var cssH = wrap.clientHeight || 540;
        var dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.floor(cssW * dpr);
        canvas.height = Math.floor(cssH * dpr);
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, (Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        var dark = document.documentElement.dataset.theme !== 'light';
        ctx.fillStyle = dark ? '#100d14' : '#f7f1e8';
        ctx.fillRect(-4, -4, W + 8, H + 8);
        bricks.forEach(function (b) {
          if (!b.alive) return;
          ctx.fillStyle = b.color;
          ctx.fillRect(b.x, b.y, b.w, b.h);
          if (b.power) {
            ctx.fillStyle = 'rgba(255,255,255,0.65)';
            ctx.fillRect(b.x + b.w / 2 - 3, b.y + 4, 6, 8);
          }
        });
        ctx.fillStyle = dark ? '#f6f1e8' : '#1b140f';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6) : ctx.rect(paddle.x, paddle.y, paddle.w, paddle.h);
        ctx.fill();
        trail.forEach(function (t) {
          ctx.globalAlpha = Math.max(0, t.life) * 2;
          ctx.fillStyle = '#e7a15a';
          ctx.beginPath();
          ctx.arc(t.x, t.y, 4, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        balls.forEach(function (b) {
          ctx.fillStyle = '#fff6e8';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(231,161,90,0.35)';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r + 5, 0, Math.PI * 2);
          ctx.fill();
        });
        drops.forEach(function (d) {
          ctx.fillStyle = d.kind === 'wide' ? '#9ad7ff' : '#e7a15a';
          ctx.fillRect(d.x - 7, d.y - 7, 14, 14);
        });
        parts.forEach(function (p) {
          ctx.globalAlpha = Math.max(0, p.life * 2);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, 3, 3);
        });
        ctx.globalAlpha = 1;
        if (paused) {
          ctx.fillStyle = 'rgba(0,0,0,0.45)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#fff';
          ctx.font = '700 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('已暂停', W / 2, H / 2);
          ctx.textAlign = 'left';
        }
      }
      function loop(now) {
        var dt = Math.min(0.05, ((now || performance.now()) - last) / 1000);
        last = now || performance.now();
        acc += dt;
        while (acc >= 1 / 60) { update(1 / 60); acc -= 1 / 60; }
        draw();
        raf = requestAnimationFrame(loop);
      }
      function fromEvent(e) {
        var rect = canvas.getBoundingClientRect();
        if (!rect.width) return;
        paddle.x = clamp(((e.clientX - rect.left) / rect.width) * W - paddle.w / 2, 8, W - paddle.w - 8);
      }
      canvas.addEventListener('pointerdown', function (e) { touching = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} fromEvent(e); });
      canvas.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse' || touching) fromEvent(e); });
      canvas.addEventListener('pointerup', function () { touching = false; });
      document.addEventListener('keydown', function (e) {
        var k = e.key.toLowerCase();
        if (k === 'arrowleft' || k === 'a') { held.left = true; e.preventDefault(); }
        if (k === 'arrowright' || k === 'd') { held.right = true; e.preventDefault(); }
        if ((k === ' ' || k === 'enter') && !(e.target && e.target.closest && e.target.closest('button'))) {
          e.preventDefault();
          if (!e.repeat && !over) launch();
        }
        if (k === 'p' || k === 'escape') { paused = !paused; document.getElementById('pauseBtn').textContent = paused ? '继续' : '暂停'; }
      });
      document.addEventListener('keyup', function (e) {
        var k = e.key.toLowerCase();
        if (k === 'arrowleft' || k === 'a') held.left = false;
        if (k === 'arrowright' || k === 'd') held.right = false;
      });
      function bindHold(btn, dir) {
        var timer = 0;
        function stop() { clearInterval(timer); timer = 0; }
        btn.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          try { btn.setPointerCapture(e.pointerId); } catch (err) {}
          held[dir] = true;
        });
        btn.addEventListener('pointerup', function () { held[dir] = false; stop(); });
        btn.addEventListener('pointercancel', function () { held[dir] = false; stop(); });
      }
      bindHold(document.getElementById('btnLeft'), 'left');
      bindHold(document.getElementById('btnRight'), 'right');
      document.getElementById('btnLaunch').addEventListener('click', function () { if (over) reset(); else launch(); });
      document.getElementById('pauseBtn').addEventListener('click', function () {
        paused = !paused;
        this.textContent = paused ? '继续' : '暂停';
      });
      document.getElementById('muteBtn').addEventListener('click', function () {
        window.XSound.toggle();
        this.textContent = window.XSound.muted ? '静音' : '声音';
      });
      againBtn.addEventListener('click', reset);
      document.getElementById('muteBtn').textContent = window.XSound.muted ? '静音' : '声音';
      reset();
      last = performance.now();
      raf = requestAnimationFrame(loop);
      void raf;
    })();
  </script>
</body>
</html>

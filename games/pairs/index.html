<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>翻牌 · XLattice</title>
  <meta name="theme-color" content="#e8eaee" />
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="../../assets/base.css" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <script src="../../assets/boot.js"></script>
  <style>
    .mem {
      width: min(440px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .mem-card {
      aspect-ratio: 3 / 4;
      padding: 0;
      border: 0;
      background: transparent;
      border-radius: 12px;
      perspective: 700px;
    }
    .mem-card:disabled { opacity: 1; cursor: default; }
    .mem-inner {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.35s ease;
    }
    .mem-card.is-open .mem-inner,
    .mem-card.is-matched .mem-inner { transform: rotateY(180deg); }
    .mem-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1px solid var(--line);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .mem-back { background: #0f6e5c; color: #f7fffc; }
    .mem-back svg { width: 28px; height: 28px; }
    .mem-front { background: var(--surface); transform: rotateY(180deg); }
    .mem-front svg { width: 46%; height: 46%; }
    .mem-card.is-matched .mem-front { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .t1 { color: #0f6e5c; } .t2 { color: #9a3412; } .t3 { color: #1d4e89; } .t4 { color: #9a3d5a; }
    .t5 { color: #3f6212; } .t6 { color: #6d28d9; } .t7 { color: #0f6f8a; } .t8 { color: #a16207; }
    [data-theme="dark"] .t1 { color: #7ddec8; }
    [data-theme="dark"] .t2 { color: #fdba74; }
    [data-theme="dark"] .t3 { color: #93c5fd; }
    [data-theme="dark"] .t4 { color: #fda4af; }
    [data-theme="dark"] .t5 { color: #bef264; }
    [data-theme="dark"] .t6 { color: #d8b4fe; }
    [data-theme="dark"] .t7 { color: #67e8f9; }
    [data-theme="dark"] .t8 { color: #fcd34d; }
  </style>
</head>
<body>
  <div class="game">
    <a class="btn btn-ghost standalone-back" href="../../">返回游戏桌</a>
    <header class="hud">
      <div class="stat"><span class="stat-k">步数</span><b id="moves">0</b></div>
      <div class="stat"><span class="stat-k">时间</span><b id="time">0 秒</b></div>
      <div class="stat"><span class="stat-k">最少</span><b id="best">—</b></div>
      <button class="btn btn-ghost spacer" id="resetBtn" type="button">重开</button>
    </header>
    <div class="mem" id="board"></div>
    <p class="hint">翻开两张。图案相同就留下。方向键可以在牌之间移动。</p>
    <p class="sr-only" id="live" aria-live="polite"></p>
    <div class="overlay" id="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
        <p class="dialog-kicker" id="ovTitle">全部配对</p>
        <p class="dialog-score"><b id="finalScore">0</b><span id="finalMeta"></span></p>
        <button class="btn btn-accent" id="againBtn" type="button">再来一局</button>
      </div>
    </div>
  </div>
  <script src="../../assets/game-bridge.js"></script>
  <script>
    (function () {
      'use strict';

      var SLUG = 'pairs';
      var boardEl = document.getElementById('board');
      var movesEl = document.getElementById('moves');
      var timeEl = document.getElementById('time');
      var bestEl = document.getElementById('best');
      var overlay = document.getElementById('overlay');
      var againBtn = document.getElementById('againBtn');
      var live = document.getElementById('live');

      function icon(body) {
        return '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
      }

      var FACES = [
        { id: 'sun', tone: 't1', svg: icon('<circle cx="24" cy="24" r="7"/><path d="M24 7v4M24 37v4M7 24h4M37 24h4M11 11l2.8 2.8M34.2 34.2 37 37M37 11l-2.8 2.8M13.8 34.2 11 37"/>') },
        { id: 'moon', tone: 't2', svg: icon('<path d="M29 8a14 14 0 1 0 7 25 11 11 0 1 1-7-25z"/>') },
        { id: 'drop', tone: 't3', svg: icon('<path d="M24 7s-11 13-11 21a11 11 0 0 0 22 0C35 20 24 7 24 7z"/>') },
        { id: 'leaf', tone: 't4', svg: icon('<path d="M12 34c10-2 20-12 22-24-12 2-22 14-22 24z"/><path d="M16 28c4-4 9-9 14-13"/>') },
        { id: 'star', tone: 't5', svg: icon('<path d="m24 6 4.5 10.2L39 17.8l-8 7.2 2.2 11.6L24 31.2 14.8 36.6 17 25l-8-7.2 10.5-1.6z"/>') },
        { id: 'bolt', tone: 't6', svg: icon('<path d="M26 5 12 26h10l-2 17 16-23H26z"/>') },
        { id: 'heart', tone: 't7', svg: icon('<path d="M24 40S11 32 11 21a8 8 0 0 1 13-6 8 8 0 0 1 13 6c0 11-13 19-13 19z"/>') },
        { id: 'gem', tone: 't8', svg: icon('<path d="M14 18 24 7l10 11L24 42z"/><path d="M14 18h20M19 18 24 42 29 18"/>') }
      ];

      var cards = [];
      var buttons = [];
      var open = [];
      var lock = false;
      var moves = 0;
      var best = window.XGame.readBest(SLUG);
      var startedAt = 0;
      var clock = 0;
      var token = 0;
      var flipTimer = 0;

      bestEl.textContent = best ? String(best) : '—';

      function fmt(ms) {
        var s = Math.max(0, Math.floor(ms / 1000));
        var m = Math.floor(s / 60);
        s = s % 60;
        if (!m) return s + ' 秒';
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      function paintTime() {
        if (!startedAt) { timeEl.textContent = '0 秒'; return; }
        timeEl.textContent = fmt(Date.now() - startedAt);
      }

      function shuffle(list) {
        for (var i = list.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = list[i];
          list[i] = list[j];
          list[j] = tmp;
        }
        return list;
      }

      function paintCard(i) {
        var card = cards[i];
        var btn = buttons[i];
        btn.classList.toggle('is-open', card.open || card.matched);
        btn.classList.toggle('is-matched', card.matched);
        btn.setAttribute('aria-pressed', card.open || card.matched ? 'true' : 'false');
        btn.setAttribute('aria-label', card.matched ? '已配对' : (card.open ? '已翻开' : '未翻开的牌'));
      }

      function win() {
        clearInterval(clock);
        var elapsed = startedAt ? Date.now() - startedAt : 0;
        var record = !best || moves < best;
        if (record) {
          best = moves;
          window.XGame.publish(SLUG, moves, best);
          bestEl.textContent = String(best);
        }
        document.getElementById('finalScore').textContent = String(moves) + ' 步';
        document.getElementById('finalMeta').textContent = fmt(elapsed) + (record ? ' · 新纪录' : (' · 最少 ' + best + ' 步'));
        overlay.hidden = false;
        live.textContent = '全部配对，用了 ' + moves + ' 步';
        againBtn.focus();
      }

      function flip(i) {
        var card = cards[i];
        if (lock || card.open || card.matched || !overlay.hidden) return;
        if (!startedAt) {
          startedAt = Date.now();
          clock = setInterval(paintTime, 250);
        }
        card.open = true;
        paintCard(i);
        open.push(i);
        if (open.length < 2) return;
        moves += 1;
        movesEl.textContent = String(moves);
        var a = cards[open[0]];
        var b = cards[open[1]];
        var ai = open[0];
        var bi = open[1];
        open = [];
        if (a.id === b.id) {
          a.matched = b.matched = true;
          paintCard(ai);
          paintCard(bi);
          if (cards.every(function (c) { return c.matched; })) win();
          return;
        }
        lock = true;
        var my = token;
        flipTimer = setTimeout(function () {
          if (my !== token) return;
          a.open = b.open = false;
          lock = false;
          paintCard(ai);
          paintCard(bi);
        }, 680);
      }

      function reset() {
        token++;
        clearTimeout(flipTimer);
        clearInterval(clock);
        clock = 0;
        startedAt = 0;
        moves = 0;
        lock = false;
        open = [];
        movesEl.textContent = '0';
        timeEl.textContent = '0 秒';
        overlay.hidden = true;
        boardEl.innerHTML = '';
        buttons = [];
        var deck = shuffle(FACES.concat(FACES).map(function (face) {
          return { id: face.id, tone: face.tone, svg: face.svg, open: false, matched: false };
        }));
        cards = deck;
        deck.forEach(function (card, index) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'mem-card';
          btn.innerHTML = '<span class="mem-inner"><span class="mem-face mem-back"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="2" fill="currentColor"/><rect x="14" y="2" width="8" height="8" rx="2" fill="currentColor" opacity=".5"/><rect x="2" y="14" width="8" height="8" rx="2" fill="currentColor" opacity=".5"/><rect x="14" y="14" width="8" height="8" rx="2" fill="currentColor"/></svg></span><span class="mem-face mem-front ' + card.tone + '">' + card.svg + '</span></span>';
          btn.addEventListener('click', function () { flip(index); });
          btn.addEventListener('keydown', function (e) {
            var col = index % 4;
            var row = Math.floor(index / 4);
            var next = null;
            if (e.key === 'ArrowLeft') next = [row, col - 1];
            else if (e.key === 'ArrowRight') next = [row, col + 1];
            else if (e.key === 'ArrowUp') next = [row - 1, col];
            else if (e.key === 'ArrowDown') next = [row + 1, col];
            if (!next) return;
            e.preventDefault();
            if (next[0] < 0 || next[1] < 0 || next[0] > 3 || next[1] > 3) return;
            buttons[next[0] * 4 + next[1]].focus();
          });
          boardEl.appendChild(btn);
          buttons.push(btn);
          paintCard(index);
        });
      }

      document.getElementById('resetBtn').addEventListener('click', reset);
      againBtn.addEventListener('click', reset);
      reset();
    })();
  </script>
</body>
</html>

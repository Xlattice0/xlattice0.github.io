<!doctype html>
<!--
  ============================================================
   XLattice's Game — 首页
   只有游戏。加新游戏去 assets/games.js
  ============================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>XLattice's Game</title>
  <meta name="description" content="XLattice 的小游戏。" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="XLattice's Game" />
  <meta property="og:url" content="https://www.xlattice.top/" />
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#08080c" media="(prefers-color-scheme: dark)" />

  <link rel="canonical" href="https://www.xlattice.top/" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/style.css" />

  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved
        ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>

<body>
  <a class="skip" href="#games">跳到游戏</a>

  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M3 3h10M3 8h10M3 13h10M3 3v10M8 3v10M13 3v10" />
          </svg>
        </span>
        <span class="brand-name">XLattice's <b>Game</b></span>
      </a>

      <a class="nav-link" href="https://github.com/Xlattice0" target="_blank" rel="noopener">GitHub</a>

      <button class="theme-btn" id="themeBtn" type="button" aria-label="切换深浅色主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 13.2A8.6 8.6 0 1 1 10.8 3a6.8 6.8 0 0 0 10.2 10.2z" />
        </svg>
      </button>
    </div>
  </header>

  <main class="page" id="games">
    <div class="page-head">
      <h1 class="page-title">全部游戏</h1>
      <span class="count" id="count">—</span>
    </div>

    <div class="grid" id="gameGrid"></div>

    <div class="empty" id="empty" hidden>暂无游戏</div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>© <span id="year">2026</span> XLattice's Game</p>
    </div>
  </footer>

  <script src="assets/games.js"></script>
  <script src="assets/app.js" defer></script>
</body>
</html>

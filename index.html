<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Xlattice</title>
  <meta name="description" content="Xlattice" />
  <meta name="theme-color" content="#07080c" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/gate.css" />
</head>
<body>
  <a class="skip" href="#play">Play</a>

  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1a2233"/>
          <stop offset="0.45" stop-color="#12151c"/>
          <stop offset="1" stop-color="#2a160f"/>
        </linearGradient>
        <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a4150"/>
          <stop offset="1" stop-color="#171b24"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="800" fill="url(#sky)"/>
      <circle cx="860" cy="140" r="90" fill="#f3e2c8" opacity=".9"/>
      <circle cx="860" cy="140" r="220" fill="#e7b07a" opacity=".08"/>
      <g stroke="#ffffff" stroke-opacity=".06">
        <path d="M0 120h1200M0 200h1200M0 280h1200M80 0v800M200 0v800M320 0v800M440 0v800M560 0v800"/>
      </g>
      <g fill="#0c0e14">
        <path d="M90 470h80v180H90zM150 420h40v230h-40zM210 450h70v200h-70z"/>
        <path d="M420 390h46v260h-46zM466 340h28v310h-28zM500 410h60v240h-60z"/>
      </g>
      <g>
        <rect x="40" y="560" width="280" height="36" rx="6" fill="url(#stone)"/>
        <rect x="40" y="560" width="280" height="5" fill="#c4554a"/>
        <rect x="380" y="500" width="160" height="22" rx="5" fill="url(#stone)"/>
        <rect x="380" y="500" width="160" height="4" fill="#e7c39a"/>
        <rect x="600" y="560" width="220" height="36" rx="6" fill="url(#stone)"/>
        <rect x="600" y="560" width="220" height="5" fill="#c4554a"/>
      </g>
      <g fill="#f0d7a8">
        <path d="M340 470l7 12-7 12-7-12z"/>
        <path d="M520 430l6 10-6 10-6-10z"/>
        <path d="M560 450l6 10-6 10-6-10z"/>
      </g>
      <g transform="translate(250 500)">
        <rect x="6" y="8" width="28" height="32" rx="8" fill="#f2d2b0"/>
        <rect x="10" y="14" width="20" height="8" rx="3" fill="#14120f"/>
        <rect x="13" y="16" width="4" height="3" fill="#d7ecff"/>
        <rect x="22" y="16" width="4" height="3" fill="#d7ecff"/>
      </g>
    </svg>
  </div>

  <header class="brand">
    <h1 class="mark"><span class="x">X</span>lattice</h1>
    <p class="sub">晶格冲刺</p>
  </header>

  <a class="ghost" href="https://github.com/Xlattice0/xlattice0.github.io" target="_blank" rel="noopener noreferrer">GitHub</a>

  <aside class="panel">
    <div class="glass">
      <h2>Welcome</h2>
      <div class="seg" role="group" aria-label="Enter">
        <button type="button" id="tab-guest" aria-pressed="true">Guest</button>
        <button type="button" id="tab-enter" aria-pressed="false">Enter</button>
        <button type="button" id="tab-create" aria-pressed="false">Create</button>
      </div>
      <a class="cta" id="play" href="play.html">Play as guest</a>
      <p class="legal">© 2026 XLattice</p>
    </div>
  </aside>

  <script>
    (function () {
      var tabs = [
        document.getElementById('tab-guest'),
        document.getElementById('tab-enter'),
        document.getElementById('tab-create')
      ];
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (other) {
            other.setAttribute('aria-pressed', other === tab ? 'true' : 'false');
          });
        });
      });
    })();
  </script>
</body>
</html>

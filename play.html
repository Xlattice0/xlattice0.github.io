<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>正在打开游戏… · XLattice's Game</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/style.css" />

  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved
        ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>

<body>
  <div class="shell">
    <header class="bar">
      <a class="bar-back" href="./">← 全部游戏</a>

      <div class="bar-title">
        <b id="gTitle">载入中…</b>
        <span id="gTag"></span>
      </div>

      <span class="bar-best">最好 <b id="gBest">—</b></span>

      <button class="bar-fs" id="fsBtn" type="button" aria-label="全屏" title="全屏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        </svg>
      </button>
    </header>

    <div class="stage" id="stage">
      <iframe id="frame" title="游戏画面" allow="fullscreen; gamepad" allowfullscreen></iframe>
    </div>
  </div>

  <script src="assets/games.js"></script>
  <script>
    (function () {
      'use strict';

      var slug = '';
      try {
        slug = new URLSearchParams(window.location.search).get('g') || '';
      } catch (e) {
        slug = '';
      }

      var games = Array.isArray(window.GAMES) ? window.GAMES : [];
      var game = null;
      for (var i = 0; i < games.length; i++) {
        if (games[i].slug === slug) { game = games[i]; break; }
      }

      var stage = document.getElementById('stage');
      var frame = document.getElementById('frame');

      function readBest(s) {
        try {
          var v = parseInt(localStorage.getItem('xg:best:' + s) || '0', 10);
          return isNaN(v) ? 0 : v;
        } catch (e) {
          return 0;
        }
      }

      /* 找不到游戏 */
      if (!game) {
        document.title = "找不到这个游戏 · XLattice's Game";
        document.getElementById('gTitle').textContent = '找不到这个游戏';
        var missing = document.createElement('div');
        missing.className = 'missing';
        missing.innerHTML =
          '这个游戏不存在,可能链接有误。<br><br>' +
          '<a href="./" style="color:#ff6b35;border-bottom:1px solid currentColor">回到全部游戏</a>';
        stage.innerHTML = '';
        stage.appendChild(missing);
        return;
      }

      /* 正常加载 */
      document.title = game.title + " · XLattice's Game";
      document.getElementById('gTitle').textContent = game.title;
      document.getElementById('gTag').textContent = game.tag || '';

      var bestEl = document.getElementById('gBest');
      var best = readBest(slug);
      bestEl.textContent = best ? String(best) : '—';

      frame.src = 'games/' + encodeURIComponent(slug) + '/';

      /* 游戏里刷新了成绩 → 同步到顶部(不用刷新页面) */
      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.type !== 'xg:score') return;
        if (data.slug && data.slug !== slug) return;
        var value = data.best || readBest(slug);
        if (value) bestEl.textContent = String(value);
      });

      /* 全屏 */
      var fsBtn = document.getElementById('fsBtn');

      function isFs() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      fsBtn.addEventListener('click', function () {
        if (isFs()) {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          return;
        }
        if (stage.requestFullscreen) {
          stage.requestFullscreen().catch(function () {});
        } else if (stage.webkitRequestFullscreen) {
          stage.webkitRequestFullscreen();
        }
      });

      document.addEventListener('fullscreenchange', function () {
        fsBtn.setAttribute('aria-label', isFs() ? '退出全屏' : '全屏');
      });

      /* 游戏里按 Esc 全屏退出后,iframe 会失焦,点一下画面让它重新收键盘 */
      frame.addEventListener('load', function () {
        try { frame.contentWindow.focus(); } catch (e) {}
      });
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>晶格冲刺 · Xlattice</title>
  <meta name="theme-color" content="#07080c" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/gate.css" />
</head>
<body class="play">
  <a class="skip" href="#stage">Play</a>
  <header class="bar">
    <a class="bar-back" href="./">Back</a>
    <h1>晶格冲刺</h1>
    <button type="button" id="pauseBtn" aria-pressed="false">Pause</button>
    <button type="button" id="muteBtn" aria-pressed="false">Mute</button>
    <button type="button" id="restartBtn">Restart</button>
    <button type="button" id="fsBtn" aria-pressed="false">Full</button>
  </header>
  <div class="stage" id="stage">
    <iframe id="frame" title="晶格冲刺" src="games/rush/" allow="fullscreen" allowfullscreen></iframe>
  </div>
  <script>
    (function () {
      var frame = document.getElementById('frame');
      var stage = document.getElementById('stage');
      var pauseBtn = document.getElementById('pauseBtn');
      var muteBtn = document.getElementById('muteBtn');
      var fsBtn = document.getElementById('fsBtn');

      function send(cmd) {
        try {
          frame.contentWindow.postMessage({ type: 'xg:cmd', cmd: cmd }, '*');
        } catch (e) {}
      }

      pauseBtn.addEventListener('click', function () { send('pause'); });
      muteBtn.addEventListener('click', function () { send('mute'); });
      document.getElementById('restartBtn').addEventListener('click', function () { send('restart'); });

      window.addEventListener('message', function (e) {
        var data = e.data;
        if (!data || data.type !== 'xg:state') return;
        if (frame.contentWindow && e.source !== frame.contentWindow) return;
        pauseBtn.setAttribute('aria-pressed', data.paused ? 'true' : 'false');
        pauseBtn.textContent = data.paused ? 'Resume' : 'Pause';
        muteBtn.setAttribute('aria-pressed', data.muted ? 'true' : 'false');
        muteBtn.textContent = data.muted ? 'Muted' : 'Mute';
      });

      function fsEl() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }
      fsBtn.addEventListener('click', function () {
        if (fsEl()) {
          var exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
          return;
        }
        var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
        if (req) req.call(stage);
      });
      document.addEventListener('fullscreenchange', function () {
        var on = !!fsEl();
        fsBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
        fsBtn.textContent = on ? 'Exit' : 'Full';
      });
    })();
  </script>
</body>
</html>
